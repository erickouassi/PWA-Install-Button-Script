<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Lost Sheep</title>
  <style>
    :root {
      --primary-color: #317EFB;
      --text-color: #2d3436;
      --bg-color: #f9f9f9;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    .container {
      padding: 20px;
      max-width: 400px;
    }

    .icon {
      font-size: 64px;
      margin-bottom: 20px;
      display: inline-block;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    p {
      margin-bottom: 30px;
      line-height: 1.5;
      color: #636e72;
    }

    .retry-btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
      text-decoration: none;
      display: inline-block;
    }

    .retry-btn:hover {
      background-color: #2664ca;
      transform: scale(1.05);
    }

    .retry-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="icon">🛰️</div>
    <h1>You're Offline</h1>
    <p>It looks like you've lost your connection. <br>
        Check your Wi-Fi or mobile data and try again.</p>
    
    <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
  </div>

  <script>
    // Optional: Auto-refresh if the user comes back online while viewing this page
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>

</body>
</html>
